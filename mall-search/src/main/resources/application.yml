spring:
  application:
    name: mall-search
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  thymeleaf:
    cache: false

  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://192.168.6.128:3306/mall-wms
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.6.128:8848
    sentinel:
      transport:
        port: 8719
        dashboard: localhost:8080
        client-ip: localhost
  redis:
    host: 192.168.6.128
    port: 6379
    password: 123456
  session:
    store-type: redis
    redis:
      namespace: spring:session

server:
  port: 8057

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: '*'
