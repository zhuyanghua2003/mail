spring:
  application:
    name: mall-ware
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss

  thymeleaf:
    cache: false
    prefix: classpath:/templates
    suffix: .html
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://mysql-master.sangomall.svc.cluster.local.:3306/mall_wms
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: nacos-server.sangomall.svc.cluster.local.:8848
    alibaba:
      seata:
        tx-service-group: mall-ware-group
    sentinel:
      transport:
        port: 8719
        dashboard: sentinel-server.sangomall.svc.cluster.local.:8858
        client-ip: localhost

server:
  port: 8050

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: '*'
