spring:
  application:
    name: mall-order
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  thymeleaf:
    cache: false
    prefix: classpath:/templates
    suffix: .html
  session:
    store-type: redis
    redis:
      namespace: spring:session
  redis:
    host: redis.sangomall.svc.cluster.local.
    port: 6379
    password: 123456



  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://mysql-master.sangomall.svc.cluster.local.:3306/mall_oms
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: nacos-server.sangomall.svc.cluster.local.:8848
    alibaba:
      seata:
        tx-service-group: mall-order-group
    sentinel:
      transport:
        port: 8719
        dashboard: sentinel-server.sangomall.svc.cluster.local.:8858
        client-ip: localhost

server:
  port: 8030
  servlet:
    session:
      timeout: 30m

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto

rocketmq:
  name-server: rocketmq-namesrv.sangomall.svc.cluster.local.:9876
  producer:
    group: order-producer
  consumer:
    group: order-consumer

user:
  names: zhangsan3
  age: 183



