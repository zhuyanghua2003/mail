spring:
  application:
    name: mall-order
  session:
    store-type: redis
    redis:
      namespace: spring:session
  redis:
    host: 192.168.6.128
    port: 6379
    password: 123456


  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://192.168.6.128:3306/mall-oms
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.6.128:8848
    alibaba:
      seata:
        tx-service-group: mall-order-group
    sentinel:
      transport:
        port: 8719
        dashboard: localhost:8080
        client-ip: localhost

server:
  port: 8042
  servlet:
    session:
      timeout: 30m

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto

rocketmq:
  name-server: 192.168.6.128:9876
  producer:
    group: order-producer
  consumer:
    group: order-consumer



