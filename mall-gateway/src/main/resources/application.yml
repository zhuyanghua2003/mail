spring:
  application:
    name: mall-gateway


  cloud:
    nacos:
      discovery:
        server-addr: 192.168.6.128:8848

    gateway:
      routes:
        - id: product_route
          uri: lb://mall-product
          predicates:
            - Path=/app/product/**
          filters:
            - RewritePath=/app/(?<segment>/?.*), /$\{segment}
        - id: third_route
          uri: lb://mall-third-party
          predicates:
            - Path=/app/third/**
          filters:
            - RewritePath=/app/third/(?<segment>/?.*), /$\{segment}
        - id: member_route
          uri: lb://mall-member
          predicates:
            - Path=/app/member/**
          filters:
            - RewritePath=/app/(?<segment>/?.*), /$\{segment}
        - id: ware_route
          uri: lb://mall-ware
          predicates:
            - Path=/app/ware/**
          filters:
            - RewritePath=/app/(?<segment>/?.*), /$\{segment}
        - id: app_route
          uri: lb://renren-fast
          predicates:
            - Path=/app/**
          filters:
            - RewritePath=/app/(?<segment>/?.*), /renren-fast/$\{segment}
        - id: msbmall_host_route1
          uri: lb://mall-product
          predicates:
            - Host=msb.mall.com


server:
  port: 8070
  address: 0.0.0.0
  tomcat:
    max-threads: 1000 # 最大工作线程（老师的服务肯定调过）
    min-spare-threads: 200
    accept-count: 2000 # 等待队列长度




